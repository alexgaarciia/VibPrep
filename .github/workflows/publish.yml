# Build and publish VibPrep to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing (OIDC): no API tokens are stored in GitHub.
# See https://docs.pypi.org/trusted-publishers/

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          INIT_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/vibprep/__init__.py').read()).group(1))")
          echo "Release tag: $TAG | pyproject.toml: $VERSION | __init__.py: $INIT_VERSION"
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$INIT_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match pyproject.toml ($VERSION) and __init__.py ($INIT_VERSION)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke test the built wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import vibprep, vibprep.pipeline; print(vibprep.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/vibprep/

    permissions:
      id-token: write  # required for Trusted Publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
