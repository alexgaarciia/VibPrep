[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibprep"
version = "0.1.0"
description = "Modular preprocessing library for vibrational spectroscopy (FTIR, Raman)"
readme = "README.md"
requires-python = ">=3.9"

authors = [
  { name = "Alejandro Leonardo García Navarro" }
]

license = { text = "MIT" }

dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.4",
  "pybaselines>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
