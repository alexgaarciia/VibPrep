[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyftir"
version = "0.1.0"
description = "Modular FTIR preprocessing library for biomedical spectroscopy"
readme = "README.md"
requires-python = ">=3.9"

authors = [
  { name = "Alejandro Leonardo García Navarro" }
]

license = { text = "MIT" }

dependencies = [
  "numpy>=1.22",
  "scipy>=1.8"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
